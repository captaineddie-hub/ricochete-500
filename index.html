for(let p of pucks)if(!p.dead&&!p.captured){ctx.shadowColor=p.owner===0?'#fb6a5d':'#6dbdff';ctx.shadowBlur=8;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x+2,p.y+4,12,7,0,0,Math.PI*2);ctx.fill();let g=ctx.createRadialGradient(p.x-4,p.y-5,0,p.x,p.y,13);if(p.owner===0){g.addColorStop(0,'#ffc1ae');g.addColorStop(.34,'#ed6a5d');g.addColorStop(1,'#9d251e')}else{g.addColorStop(0,'#b1e3ff');g.addColorStop(.34,'#51a9e5');g.addColorStop(1,'#15568d')}ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffffb0';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#f6e1af';ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#34424a';ctx.lineWidth=.75;ctx.stroke();ctx.shadowBlur=0}
if(state==='aim'&&!(settings.mode==='cpu'&&turn===1)&&!(settings.mode==='online'&&(!onlineReady||turn!==(isHost?0:1)))){ctx.globalAlpha=.95;let x=puckDrawX,y=puckDrawY;let g=ctx.createRadialGradient(x-3,y-5,0,x,y,15);g.addColorStop(0,turn?'#bceeff':'#ffccac');g.addColorStop(1,turn?'#1973ae':'#ac312c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R+2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff2d3';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()}ctx.restore()}
function frame(ts){let dt=Math.min(.06,(ts-last)/1000||0);last=ts;acc+=dt;let n=0;while(acc>=1/120&&n<10){update(1/120);acc-=1/120;n++}draw();requestAnimationFrame(frame)}

function snapshot(){return {scores:[...scores],round,shot,turn,state,pucks:pucks.map(p=>({...p})),layout,bonusTarget:bonusTarget?{...bonusTarget}:null,bonusBank:[...bonusBank]}}
function sendNet(data){if(connection?.open)try{connection.send(data)}catch(e){}}
function applySnapshot(v){if(!v||!Array.isArray(v.scores)||!Array.isArray(v.pucks)||!layouts[v.layout])return;scores=v.scores.slice();round=v.round;shot=v.shot;turn=v.turn;pucks=v.pucks.map(p=>({...p}));selectLayout(v.layout);bonusTarget=v.bonusTarget?{...v.bonusTarget}:null;bonusBank=Array.isArray(v.bonusBank)?v.bonusBank.slice():[0,0];state=v.state;drag=null;setPowerMeter();$('modal').classList.add('hidden');updateUI()}
let roomTimeout=0,roomEpoch=0;
function stopRoomTimer(){clearTimeout(roomTimeout);roomTimeout=0}
function roomMessage(title,detail,canRetry=true){
 roomEpoch++;stopRoomTimer();connecting=false;onlineReady=false;
 try{connection?.close();peer?.destroy()}catch(e){}
 connection=null;peer=null;
 modal('<h1>'+title+'</h1><p>'+detail+'</p>'+(canRetry?'<button class="btn primary" id="retryRoom">TRY AGAIN</button>':'')+'<button class="btn" id="roomBack">BACK TO ONLINE MENU</button>');
 if(canRetry)$('retryRoom').onclick=()=>startOnline(isHost,roomCode);
 $('roomBack').onclick=onlineMenu;
}
function pendingRoom(title,description,showCopy){
 modal('<h1>'+title+'</h1><p id="roomStatus">'+description+'</p>'+(showCopy?'<button class="btn primary" id="copyInvite">COPY INVITE LINK</button>':'')+'<button class="btn" id="leaveRoom">CANCEL</button>');
 if(showCopy)$('copyInvite').onclick=()=>{const url=location.origin+location.pathname+'?room='+roomCode;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>showToast('INVITE COPIED')).catch(()=>showToast('SHARE CODE '+roomCode));else showToast('SHARE CODE '+roomCode)};
 $('leaveRoom').onclick=()=>{roomEpoch++;stopRoomTimer();connecting=false;onlineReady=false;try{connection?.close();peer?.destroy()}catch(e){}connection=null;peer=null;onlineMenu()};
}
function attachConnection(c,epoch){
 connection=c;
 c.on('open',()=>{if(epoch!==roomEpoch)return;stopRoomTimer();onlineReady=true;connecting=false;start('online');if(isHost)sendNet({type:'welcome',snapshot:snapshot()});updateUI();showToast('ONLINE MATCH CONNECTED!')});
 c.on('data',m=>{if(epoch!==roomEpoch||!m||typeof m!=='object')return;
  if(m.type==='welcome'&&!isHost)applySnapshot(m.snapshot);
  else if(m.type==='shot'&&state==='aim'&&m.number===shot&&m.owner===(isHost?1:0)){const vx=Number(m.vx),vy=Number(m.vy);if(Number.isFinite(vx)&&Number.isFinite(vy)&&vy<0&&vy>-1200&&Math.abs(vx)<=220){bonusTarget=m.bonusTarget?{...m.bonusTarget}:null;shoot(vx,vy,m.owner)}}
  else if(m.type==='sync'&&!isHost){applySnapshot(m.snapshot);if(state==='roundover')modal('<h1>ROUND COMPLETE</h1><p>Counting the pucks…</p>')}
  else if(m.type==='result'&&!isHost){applySnapshot(m.snapshot);if(m.won){modal('<h1>MATCH COMPLETE</h1><p>Red '+scores[0]+' — Blue '+scores[1]+'</p><button class="btn primary" id="againNet">Back to Menu</button>');$('againNet').onclick=menu}else modal('<h1>ROUND '+round+'</h1><p>Red +'+m.gain[0]+' / Blue +'+m.gain[1]+'</p><div class="stats"><span>RED '+scores[0]+'</span><span>BLUE '+scores[1]+'</span></div><p>Waiting for host to begin next round…</p>')}
 });
 c.on('close',()=>{if(epoch!==roomEpoch)return;if(!onlineReady){roomMessage('ROOM DID NOT CONNECT','The connection closed before the match started. Check the code and try again.')}else{onlineReady=false;showToast('OPPONENT DISCONNECTED');updateUI()}});
 c.on('error',()=>{if(epoch!==roomEpoch)return;if(!onlineReady)roomMessage('CONNECTION FAILED','The two phones could not establish a direct connection. Try switching networks or opening the invite in Safari/Chrome.');else{onlineReady=false;showToast('NETWORK ERROR');updateUI()}});
}
function onlineMenu(){roomEpoch++;stopRoomTimer();connecting=false;modalPrev=state;state='paused';modal('<h1>ONLINE MATCH</h1><p>One player creates a private room and keeps it open. The other joins from a second phone.</p><button class="btn primary" id="hostGame">CREATE ROOM</button><input id="joinCode" class="roomInput" maxlength="6" autocomplete="off" placeholder="6-LETTER CODE"><button class="btn" id="joinGame">JOIN ROOM</button><p style="font-size:11px">Requires two devices and internet. WebRTC connections may fail on restrictive Wi-Fi or in-app browsers.</p><button class="btn" id="backMenu">BACK</button>');$('joinCode').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,6);$('hostGame').onclick=()=>startOnline(true);$('joinGame').onclick=()=>startOnline(false,$('joinCode').value);$('backMenu').onclick=menu}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();let done=false;const script=document.createElement('script');const timer=setTimeout(()=>{if(!done){done=true;reject(Error('Could not load the online library. Check your internet connection.'))}},9000);script.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';script.onload=()=>{if(done)return;done=true;clearTimeout(timer);window.Peer?resolve():reject(Error('Online library unavailable'))};script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);reject(Error('Online library blocked by browser or network'))};document.head.appendChild(script)})}
async function startOnline(host,code=''){
 if(connecting)return;
 const epoch=++roomEpoch;connecting=true;isHost=host;onlineReady=false;
 roomCode=host?Math.random().toString(36).slice(2,8).toUpperCase():String(code).trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(roomCode.length!==6){connecting=false;roomMessage('INVALID ROOM CODE','Enter the six-character code from the host.');return}
 pendingRoom(host?'SETTING UP ROOM':'JOINING ROOM',host?'Connecting to the room service…':'Looking for '+roomCode+'…',host);
 roomTimeout=setTimeout(()=>{if(epoch!==roomEpoch||onlineReady)return;roomMessage(host?'ROOM SETUP TIMED OUT':'JOIN TIMED OUT',host?'Could not establish the room service connection. Check internet and retry.':'The host may have closed the room, or your phones could not establish a WebRTC connection. Confirm the code, keep the host room open, and retry.')},18000);
 try{
  await loadPeer();if(epoch!==roomEpoch)return;
  if(peer){try{connection?.close();peer.destroy()}catch(e){}}
  peer=new window.Peer(host?'ric500-'+roomCode:undefined,{debug:1});
  peer.on('open',()=>{
   if(epoch!==roomEpoch)return;
   if(host){const el=$('roomStatus');if(el)el.textContent='Room ready! Share '+roomCode+' and keep this screen open until your friend joins.';stopRoomTimer();connecting=false}
   else{const el=$('roomStatus');if(el)el.textContent='Room found? Negotiating a secure connection…';attachConnection(peer.connect('ric500-'+roomCode,{reliable:true}),epoch)}
  });
  peer.on('connection',c=>{if(epoch!==roomEpoch){c.close();return}if(host&&!onlineReady&&!connection)attachConnection(c,epoch);else c.close()});
  peer.on('error',err=>{if(epoch!==roomEpoch)return;const type=err?.type||'network';
   const detail=type==='peer-unavailable'?'Room '+roomCode+' is not available. The host must create the room and leave it open before you join.':type==='unavailable-id'?'This room code is already being used. Create another room.':type==='browser-incompatible'?'This browser does not support WebRTC. Open the game directly in Safari or Chrome.':'Could not connect ('+type+'). Try Safari or Chrome, or switch from Wi-Fi to cellular.';
   roomMessage('ONLINE CONNECTION ERROR',detail);
  });
  peer.on('disconnected',()=>{if(epoch!==roomEpoch||onlineReady)return;roomMessage('ROOM SERVICE DISCONNECTED','Lost the room service connection. Try again.')});
 }catch(err){if(epoch===roomEpoch)roomMessage('ONLINE UNAVAILABLE',String(err?.message||err))}
}
function syncSound(){$('soundBtn').textContent=settings.sound?'♪ Sound On':'♪ Sound Off'}$('menuBtn').onclick=menu;$('rulesBtn').onclick=rules;$('soundBtn').onclick=()=>{settings.sound=!settings.sound;syncSound();if(settings.sound)beep(530)};$('restartBtn').onclick=()=>start();document.addEventListener('visibilitychange',()=>{if(document.hidden){last=0;acc=0}});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state!=='menu')menu();if(e.key===' '&&state==='roundover')roundEnd()});syncSound();start('cpu');if(new URLSearchParams(location.search).has('room'))onlineMenu();requestAnimationFrame(frame);
})();</script></body></html>
