</style></head><body><main class="shell"><header class="top"><div><div class="brand">RICOCHET <span>500</span></div><div class="tiny">CLASSIC TABLETOP SHUFFLEBOARD</div></div><button class="btn" id="menuBtn" aria-label="Menu">☰ Menu</button></header><section class="scorebar"><div id="redCard" class="player red"><div class="name">RED</div><div class="points" id="redScore">0</div></div><div class="center"><div id="roundLabel">ROUND 1</div><small id="turnLabel">SHOT 1 / 8</small></div><div id="blueCard" class="player blue"><div class="name" id="blueName">CPU</div><div class="points" id="blueScore">0</div></div></section><section class="arena" id="arena"><canvas id="game" aria-label="Ricochet game board, pull puck back to shoot"></canvas><aside class="sideMeter" id="sideMeter" aria-label="Shot strength indicator"><div class="meterTitle">POWER</div><div class="meterTrack"><div class="meterFill" id="meterFill"></div></div><div class="meterValue" id="meterValue">0%</div></aside><div id="toast" class="toast"></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div></section><div class="hud"><div class="hint" id="hint">Pull the puck backward like a slingshot<small>Release to shoot • aim with your pull</small></div><div class="chips" id="chips"></div></div><div class="bottom"><button class="btn" id="rulesBtn">How to Play</button><button class="btn" id="soundBtn">♪ Sound On</button><button class="btn primary" id="restartBtn">New Game</button></div><div class="footer">An original skill game inspired by classic tabletop bank-shot games.</div></main><script>
(()=>{'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d'),arena=document.getElementById('arena');const $=id=>document.getElementById(id);let W=420,H=760,scale=1,offsX=0,offsY=0,last=0,acc=0;const R=11;const topY=84,divX=210,divTop=290,divBot=600,boardL=26,boardR=394,boardB=722;const seg=(ax,ay,bx,by,thick=7)=>({ax,ay,bx,by,thick});
const layouts={
classic:{name:'CLASSIC BANK',tag:'THE ORIGINAL',difficulty:'EASY',desc:'The classic V-cushion tabletop game.',theme:'classic',bars:[seg(28,235,209,75),seg(209,75,392,235)]},
wide:{name:'WIDE REBOUND',tag:'OPEN ANGLES',difficulty:'MEDIUM',desc:'Wide-angle return with natural banking.',theme:'wood',bars:[seg(28,190,209,83),seg(209,83,392,190)]},
precision:{name:'PRECISION POINT',tag:'SHARP ANGLES',difficulty:'HARD',desc:'Deep rebound corners reward careful aim.',theme:'neon',bars:[seg(28,257,209,110),seg(209,110,392,257)]},
pool:{name:'POOL HALL BANK',tag:'BILLIARDS',difficulty:'MEDIUM',desc:'Green felt, mahogany rails, extra billiard cushions.',theme:'pool',bars:[seg(28,218,209,91),seg(209,91,392,218),seg(241,313,278,283,8),seg(355,390,386,356,8),seg(37,343,68,373,8)]},
double:{name:'DOUBLE BANK',tag:'TWO TOUCH',difficulty:'HARD',desc:'Extra bumpers invite two-stage ricochet shots.',theme:'neon',bars:[seg(28,220,209,85),seg(209,85,392,220),seg(266,307,360,340,9),seg(56,347,133,310,9)]},

split:{name:'SPLIT LANE',tag:'PICK A PATH',difficulty:'EXPERT',desc:'A maze of deflectors rewards creative bank shots.',theme:'sunset',bars:[seg(28,227,209,80),seg(209,80,392,227),seg(72,326,169,361,8),seg(247,315,331,278,8),seg(92,426,158,444,7)]}
};const palettes={classic:['#ffe994','#e8bf5d','#936730','#44321d','#edc86e'],wood:['#e7ba7a','#a56c39','#604021','#382313','#f8cf80'],neon:['#344161','#141c37','#a83de5','#fff5e9','#f95cff'],pool:['#2d9666','#13583f','#6c3a21','#fff5d7','#edc36a'],steel:['#c4d8e5','#617f99','#3d5669','#16354b','#f2d07c'],sunset:['#f6a86d','#8e3576','#522346','#fff0da','#ffcf69']};let layout='classic',bumpers=layouts[layout].bars;let settings={sound:true,mode:'cpu'};let peer=null,connection=null,roomCode='',isHost=false,onlineReady=false,connecting=false;let state='menu',pucks=[],scores=[0,0],turn=0,shot=0,round=1,drag=null,queued=false,settle=0,shotAge=0,modalPrev='aim',toastTimeout=0,aiTimer=0,best=Number(localStorage.getItem('ricochet500best')||0);let audio=null;
function beep(freq=300,vol=.06,dur=.07){if(!settings.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function resize(){const r=C.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);C.width=Math.round(r.width*dpr);C.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(r.width/W,r.height/H);offsX=(r.width-W*scale)/2;offsY=(r.height-H*scale)/2;draw()}const ro=new ResizeObserver(resize);ro.observe(arena);
function start(mode=settings.mode){if(mode!=='online'&&peer){try{connection?.close();peer.destroy()}catch(e){}peer=null;connection=null;onlineReady=false;roomCode=''}settings.mode=mode;scores=[0,0];turn=0;shot=0;round=1;pucks=[];drag=null;queued=false;setPowerMeter();state='aim';$('modal').classList.add('hidden');$('blueName').textContent=mode==='cpu'?'CPU':mode==='online'?'ONLINE':'BLUE';updateUI();beep(420);}
function updateUI(){$('redScore').textContent=scores[0];$('blueScore').textContent=scores[1];$('roundLabel').textContent=`ROUND ${round}`;$('turnLabel').textContent=`SHOT ${Math.min(shot+1,8)} / 8`;$('redCard').classList.toggle('active',turn===0);$('blueCard').classList.toggle('active',turn===1);$('hint').innerHTML=state==='rolling'?'Pucks in motion…<small>Watch for bumps and knockouts!</small>':state==='roundover'?'Round complete<small>Tap to continue</small>':turn===1&&settings.mode==='cpu'?'CPU lining up its shot…<small>Can you beat the machine?</small>':'Pull BACK and release!<small>Watch the side power meter • angle the pull to aim</small>';if(settings.mode==='online'){$('hint').innerHTML=(!onlineReady?'Waiting for player…':turn===(isHost?0:1)?'YOUR TURN — PULL BACK TO SHOOT':'OPPONENT TURN — WATCH THE PUCK')+'<small>'+layouts[layout].name+' · Room '+roomCode+'</small>'}let chips='';for(let i=0;i<4;i++)chips+=`<span class="chip ${i<Math.ceil(shot/2)?'r':''}"></span>`;chips+='<span style="width:7px"></span>';for(let i=0;i<4;i++)chips+=`<span class="chip ${i<Math.floor(shot/2)?'b':''}"></span>`;$('chips').innerHTML=chips;}
function showToast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),1500)}
function modal(html){$('panel').innerHTML=html;$('modal').classList.remove('hidden')}
function selectLayout(id){if(!layouts[id])return;layout=id;bumpers=layouts[layout].bars;draw()}
function renderCoursePreview(){let c=layouts[layout],v=$('coursePreview');if(v)v.innerHTML='<b>'+c.tag+'</b> · '+c.difficulty+'<small>'+c.desc+'</small>'}
function menu(){modalPrev=state;state='paused';modal(`<h1>RICOCHET 500</h1><p>Bank the puck. Beat the pit.<br>First to 500 wins!</p><div class="stats"><span>🔴 RED</span><span>🔵 BLUE</span></div><button class="btn primary" id="one">▶ Play vs Computer</button><button class="btn" id="two">👥 Two Players — Pass & Play</button><button class="btn" id="online">🌐 Online Match — Private Room</button><div class="layoutPick"><label for="layoutChoice">CHOOSE YOUR COURSE</label><select id="layoutChoice">${Object.entries(layouts).map(([id,c])=>`<option value="${id}" ${layout===id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="coursePreview" id="coursePreview"></div><button class="btn" id="how">How to Play</button>${modalPrev!=='menu'&&modalPrev!=='won'?'<button class="btn" id="resume">Resume Game</button>':''}<div class="toggle"><label for="soundToggle">Sound effects</label><input type="checkbox" id="soundToggle" ${settings.sound?'checked':''}></div><p style="font-size:11px">Made for touchscreens. Works offline after loading.</p>`);$('one').onclick=()=>start('cpu');$('two').onclick=()=>start('local');$('online').onclick=onlineMenu;$('layoutChoice').onchange=e=>{selectLayout(e.target.value);renderCoursePreview()};renderCoursePreview();$('how').onclick=rules;$('soundToggle').onchange=e=>{settings.sound=e.target.checked;syncSound()};if($('resume'))$('resume').onclick=()=>{state=modalPrev;$('modal').classList.add('hidden')}}
function rules(){let prev=state==='paused'?modalPrev:state;state='paused';modal(`<h1>HOW TO PLAY</h1><p style="text-align:left"><b>1.</b> Touch the starting puck at bottom-right.<br><b>2.</b> Touch the puck near the middle-right of the board, pull your finger DOWN and slightly sideways like a slingshot, then release. Longer pull = more strength; pull angle = launch direction. Cancel by pushing your finger back to the starting puck.<br><b>3.</b> Bounce off the angled cushions to enter the left scoring lane.<br><b>4.</b> Score <b>10, 20, 50 or 100</b>. The open Pit at the far end is worth zero; side rails keep pucks on the board!<br><b>5.</b> Each round has exactly four RED and four BLUE pucks, alternating turns. Pucks knock each other and can fall into the Pit at the end.<br><b>6.</b> Only the pucks left on the board score after the eighth shot. First to <b>500</b> wins.</p><p>Tip: Shoot mostly straight UP along the right side. Smaller adjustments change where the puck comes down.</p><button class="btn primary" id="back">${prev==='menu'?'Start Playing':'Back to Game'}</button>`);$('back').onclick=()=>{if(prev==='menu')start('cpu');else {state=prev;$('modal').classList.add('hidden')}}}
function norm(x,y){let m=Math.hypot(x,y)||1;return [x/m,y/m]}function shoot(vx,vy,owner=turn){if(state!=='aim')return;let speed=Math.hypot(vx,vy);if(speed<300)return;vx=Math.max(-165,Math.min(165,vx));let puck={x:310,y:590,vx,vy,r:R,owner,moving:true,dead:false};pucks.push(puck);state='rolling';drag=null;settle=0;shotAge=0;updateUI();beep(410,.075,.10);}
function pullShot(dx,dy){let pull=Math.max(0,Math.min(125,dy));let angle=Math.max(-.22,Math.min(.22,-dx/Math.max(65,pull)));let speed=340+pull*5.8;let vy=-speed/Math.hypot(1,angle);return {vx:angle*-vy,vy,power:Math.round(pull/125*100),pull};}function setPowerMeter(n=0,live=false){let v=Math.max(0,Math.min(100,Math.round(n)));$('meterFill').style.height=v+'%';$('meterValue').textContent=v+'%';$('sideMeter').classList.toggle('live',live)}function point(e){let b=C.getBoundingClientRect();return {x:(e.clientX-b.left-offsX)/scale,y:(e.clientY-b.top-offsY)/scale}}
C.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='aim'||turn===1&&settings.mode==='cpu'||settings.mode==='online'&&(!onlineReady||turn!==(isHost?0:1)))return;let p=point(e);if(Math.hypot(p.x-310,p.y-590)<65){drag={startX:p.x,startY:p.y,x:p.x,y:p.y};C.setPointerCapture(e.pointerId);beep(190,.025,.03)}});C.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let p=point(e);drag.x=p.x;drag.y=p.y;setPowerMeter(pullShot(drag.x-drag.startX,drag.y-drag.startY).power,true)});C.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});function pointerRelease(e){if(!drag)return;e.preventDefault();let p=point(e);let dx=p.x-drag.startX,dy=p.y-drag.startY;drag=null;setPowerMeter();if(dy<14)return;let a=pullShot(dx,dy);if(settings.mode==='online')sendNet({type:'shot',vx:a.vx,vy:a.vy,owner:turn,number:shot});shoot(a.vx,a.vy)}C.addEventListener('pointerup',pointerRelease);C.addEventListener('pointercancel',()=>{drag=null;setPowerMeter()});
function segHit(p,s,rest=.90){let ux=s.bx-s.ax,uy=s.by-s.ay,len2=ux*ux+uy*uy,t=Math.max(0,Math.min(1,((p.x-s.ax)*ux+(p.y-s.ay)*uy)/len2));let cx=s.ax+t*ux,cy=s.ay+t*uy,dx=p.x-cx,dy=p.y-cy,dist=Math.hypot(dx,dy);let thick=s.thick||5,rr=p.r+thick;if(dist>=rr)return false;let nx,ny;if(dist>0.0001){nx=dx/dist;ny=dy/dist}else{[nx,ny]=norm(-uy,ux)}p.x+=nx*(rr-dist+.05);p.y+=ny*(rr-dist+.05);let dot=p.vx*nx+p.vy*ny;if(dot<0){p.vx-=(1+rest)*dot*nx;p.vy-=(1+rest)*dot*ny;let tx=-ny,ty=nx,tan=p.vx*tx+p.vy*ty;p.vx-=tan*tx*.018;p.vy-=tan*ty*.018;if(Math.abs(dot)>110)beep(190+Math.min(400,Math.abs(dot)*.55),.033,.05)}return true}
function collision(a,b){if(a.dead||b.dead)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>=min)return;let nx=d?dx/d:1,ny=d?dy/d:0,o=(min-d+.01)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let j=-(1+.69)*rv/2;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;if(Math.abs(rv)>85)beep(250+Math.min(500,Math.abs(rv)),.045,.07)}}
function update(dt){if(state!=='rolling')return;shotAge+=dt;const boundaries=[{ax:boardL,ay:242,bx:boardL,by:boardB,thick:6},{ax:boardR,ay:242,bx:boardR,by:boardB,thick:6},{ax:divX,ay:divTop,bx:divX,by:divBot,thick:5},...bumpers.map(s=>({...s,thick:s.thick||7,bumper:true}))];let moving=0;for(let p of pucks){if(p.dead)continue;let speed=Math.hypot(p.vx,p.vy);if(speed>.05){let dragForce=245;let next=Math.max(0,speed-dragForce*dt);p.vx*=next/speed;p.vy*=next/speed;p.x+=p.vx*dt;p.y+=p.vy*dt;}for(let s of boundaries)segHit(p,s,s.bumper?.82:.24);if((p.x<divX&&p.y>boardB-p.r)||(p.y>boardB+p.r)||(p.y<topY-31)){p.dead=true;p.vx=p.vy=0;beep(95,.05,.11)}if(Math.hypot(p.vx,p.vy)<8){p.vx=0;p.vy=0}else moving++}for(let i=0;i<pucks.length;i++)for(let j=i+1;j<pucks.length;j++)collision(pucks[i],pucks[j]);if(moving===0)settle+=dt;else settle=0;if(settle>.35||shotAge>13){for(let p of pucks)if(Math.hypot(p.vx,p.vy)<15){p.vx=p.vy=0} if(shotAge>13)for(let p of pucks){p.vx=p.vy=0}endShot()}}

function endShot(){state='aim';shot++;turn=shot%2;let just=pucks[pucks.length-1],score=points(just);showToast(just.dead?'IN THE PIT — 0':score?`${score} ZONE!`:'SET UP THE NEXT SHOT!');if(shot>=8){state='roundover';setTimeout(roundEnd,1200)}else if(settings.mode==='cpu'&&turn===1){aiTimer=setTimeout(cpuShoot,800)}updateUI();if(settings.mode==='online'&&isHost)sendNet({type:'sync',snapshot:snapshot()})}
function roundEnd(){if(state!=='roundover'||settings.mode==='online'&&!isHost)return;let gain=[0,0];for(let p of pucks)gain[p.owner]+=points(p);scores[0]+=gain[0];scores[1]+=gain[1];best=Math.max(best,scores[0]);localStorage.setItem('ricochet500best',best);beep(600,.065,.17);if(scores[0]>=500||scores[1]>=500){if(settings.mode==='online')sendNet({type:'result',snapshot:snapshot(),won:true});let winner=scores[0]===scores[1]?'TIE GAME!':scores[0]>scores[1]?'RED WINS!':settings.mode==='cpu'?'CPU WINS!':'BLUE WINS!';state='won';modal(`<h1>${winner}</h1><p>Final score</p><div class="stats"><span>🔴 ${scores[0]}</span><span>🔵 ${scores[1]}</span></div><p>Great banking! Ready for another match?</p><button class="btn primary" id="again">Play Again</button><button class="btn" id="switch">Change Mode</button>`);$('again').onclick=()=>start();$('switch').onclick=menu;updateUI();return}modal(`<h1>ROUND ${round}</h1><p>All eight pucks are in. The score is counted!</p><div class="stats"><span>🔴 +${gain[0]}</span><span>🔵 +${gain[1]}</span></div><p>Total: <b>${scores[0]} – ${scores[1]}</b> · First to 500</p><button class="btn primary" id="next">Next Round →</button>`);$('next').onclick=()=>{round++;shot=0;turn=0;pucks=[];state='aim';$('modal').classList.add('hidden');updateUI();if(settings.mode==='online')sendNet({type:'sync',snapshot:snapshot()})};updateUI();if(settings.mode==='online')sendNet({type:'result',snapshot:snapshot(),gain})}

function frame(ts){let dt=Math.min(.06,(ts-last)/1000||0);last=ts;acc+=dt;let n=0;while(acc>=1/120&&n<10){update(1/120);acc-=1/120;n++}draw();requestAnimationFrame(frame)}

function snapshot(){return {scores:[...scores],round,shot,turn,state,pucks:pucks.map(p=>({...p})),layout}}
function sendNet(data){if(connection?.open)try{connection.send(data)}catch(e){}}
function applySnapshot(v){if(!v||!Array.isArray(v.scores)||!Array.isArray(v.pucks)||!layouts[v.layout])return;scores=v.scores.slice();round=v.round;shot=v.shot;turn=v.turn;pucks=v.pucks.map(p=>({...p}));selectLayout(v.layout);state=v.state;drag=null;setPowerMeter();$('modal').classList.add('hidden');updateUI()}
function attachConnection(c){connection=c;c.on('open',()=>{onlineReady=true;connecting=false;start('online');if(isHost)sendNet({type:'welcome',snapshot:snapshot()});updateUI();showToast('PLAYER CONNECTED!')});c.on('data',m=>{if(!m||typeof m!=='object')return;if(m.type==='welcome'&&!isHost)applySnapshot(m.snapshot);else if(m.type==='shot'&&state==='aim'&&m.number===shot&&m.owner===(isHost?1:0)){const vx=Number(m.vx),vy=Number(m.vy);if(Number.isFinite(vx)&&Number.isFinite(vy)&&vy<0&&vy>-1200&&Math.abs(vx)<=165)shoot(vx,vy,m.owner)}else if(m.type==='sync'&&!isHost){applySnapshot(m.snapshot);if(state==='roundover')modal('<h1>ROUND COMPLETE</h1><p>Counting the pucks…</p>')}else if(m.type==='result'&&!isHost){applySnapshot(m.snapshot);if(m.won){modal('<h1>MATCH COMPLETE</h1><p>Red '+scores[0]+' — Blue '+scores[1]+'</p><button class="btn primary" id="againNet">Back to Menu</button>');$('againNet').onclick=menu}else modal('<h1>ROUND '+round+'</h1><p>Red +'+m.gain[0]+' / Blue +'+m.gain[1]+'</p><div class="stats"><span>RED '+scores[0]+'</span><span>BLUE '+scores[1]+'</span></div><p>Waiting for host to begin next round…</p>')}});c.on('close',()=>{onlineReady=false;showToast('OTHER PLAYER DISCONNECTED');updateUI()});c.on('error',()=>{onlineReady=false;showToast('NETWORK ERROR');updateUI()})}
function onlineMenu(){modalPrev=state;state='paused';modal('<h1>ONLINE MATCH</h1><p>Create a private match and share the room code with your friend.</p><button class="btn primary" id="hostGame">CREATE ROOM</button><input id="joinCode" class="roomInput" maxlength="6" autocomplete="off" placeholder="6-LETTER CODE"><button class="btn" id="joinGame">JOIN ROOM</button><p style="font-size:11px">Two-player invite matches. Both phones need internet. Connection may depend on network conditions.</p><button class="btn" id="backMenu">BACK</button>');$('joinCode').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,6);$('hostGame').onclick=()=>startOnline(true);$('joinGame').onclick=()=>startOnline(false,$('joinCode').value);$('backMenu').onclick=menu}
function loadPeer(){return new Promise((resolve,reject)=>{if(window.Peer)return resolve();const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';x.onload=()=>window.Peer?resolve():reject(Error('Online library unavailable'));x.onerror=()=>reject(Error('Could not load online service'));document.head.appendChild(x)})}
async function startOnline(host,code=''){if(connecting)return;connecting=true;onlineReady=false;isHost=host;try{await loadPeer();roomCode=host?Math.random().toString(36).slice(2,8).toUpperCase():code.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(roomCode.length!==6)throw Error('Enter a six-character room code');if(peer){connection?.close();peer.destroy()}modal('<h1>'+(host?'ROOM '+roomCode:'JOINING ROOM')+'</h1><p>'+(host?'Share this code or invite link. Your game starts when your friend joins.':'Connecting to your friend…')+'</p><button class="btn primary" id="copyInvite">COPY INVITE LINK</button><button class="btn" id="leaveRoom">CANCEL</button>');$('copyInvite').onclick=()=>{const url=location.origin+location.pathname+'?room='+roomCode;navigator.clipboard?.writeText(url).then(()=>showToast('INVITE COPIED')).catch(()=>showToast(roomCode))};$('leaveRoom').onclick=()=>{connecting=false;connection?.close();peer?.destroy();peer=null;onlineMenu()};peer=new window.Peer(host?'ric500-'+roomCode:undefined);peer.on('open',()=>{if(!host)attachConnection(peer.connect('ric500-'+roomCode,{reliable:true}))});peer.on('connection',c=>{if(host&&!onlineReady)attachConnection(c);else c.close()});peer.on('error',e=>{connecting=false;showToast('ROOM CONNECTION ERROR');if(e.type==='unavailable-id')onlineMenu()})}catch(e){connecting=false;modal('<h1>ONLINE UNAVAILABLE</h1><p>'+String(e.message||e)+'</p><button class="btn primary" id="backOnline">BACK</button>');$('backOnline').onclick=onlineMenu}}
function syncSound(){$('soundBtn').textContent=settings.sound?'♪ Sound On':'♪ Sound Off'}$('menuBtn').onclick=menu;$('rulesBtn').onclick=rules;$('soundBtn').onclick=()=>{settings.sound=!settings.sound;syncSound();if(settings.sound)beep(530)};$('restartBtn').onclick=()=>start();document.addEventListener('visibilitychange',()=>{if(document.hidden){last=0;acc=0}});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state!=='menu')menu();if(e.key===' '&&state==='roundover')roundEnd()});syncSound();start('cpu');if(new URLSearchParams(location.search).has('room'))onlineMenu();requestAnimationFrame(frame);
