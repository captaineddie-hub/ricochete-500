</style></head><body><main class="shell"><header class="top"><div><div class="brand">RICOCHET <span>500</span></div><div class="tiny">CLASSIC TABLETOP SHUFFLEBOARD</div></div><button class="btn" id="menuBtn" aria-label="Menu">☰ Menu</button></header><section class="scorebar"><div id="redCard" class="player red"><div class="name">RED</div><div class="points" id="redScore">0</div></div><div class="center"><div id="roundLabel">ROUND 1</div><small id="turnLabel">SHOT 1 / 8</small></div><div id="blueCard" class="player blue"><div class="name" id="blueName">CPU</div><div class="points" id="blueScore">0</div></div></section><section class="arena" id="arena"><canvas id="game" aria-label="Ricochet game board, flick puck toward rubber bumpers"></canvas><div id="toast" class="toast"></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div></section><div class="hud"><div class="hint" id="hint">Slide the puck toward the cushions<small>Soft, precise shots win • pucks can fall off the table</small></div><div class="chips" id="chips"></div></div><div class="bottom"><button class="btn" id="rulesBtn">How to Play</button><button class="btn" id="soundBtn">♪ Sound On</button><button class="btn primary" id="restartBtn">New Game</button></div><div class="footer">An original skill game inspired by classic tabletop bank-shot games.</div></main><script>
(()=>{'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d'),arena=document.getElementById('arena');const $=id=>document.getElementById(id);let W=420,H=760,scale=1,offsX=0,offsY=0,last=0,acc=0;const R=11;const topY=84,divX=210,divTop=290,divBot=600,boardL=26,boardR=394,boardB=722;const bumpers=[{ax:28,ay:235,bx:209,by:75},{ax:209,ay:75,bx:392,by:235}];let settings={sound:true,mode:'cpu'};let state='menu',pucks=[],scores=[0,0],turn=0,shot=0,round=1,drag=null,queued=false,settle=0,shotAge=0,modalPrev='aim',toastTimeout=0,aiTimer=0,best=Number(localStorage.getItem('ricochet500best')||0);let audio=null;
function beep(freq=300,vol=.06,dur=.07){if(!settings.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function resize(){const r=arena.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);C.width=Math.round(r.width*dpr);C.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(r.width/W,r.height/H);offsX=(r.width-W*scale)/2;offsY=(r.height-H*scale)/2;draw()}const ro=new ResizeObserver(resize);ro.observe(arena);
function start(mode=settings.mode){settings.mode=mode;scores=[0,0];turn=0;shot=0;round=1;pucks=[];drag=null;queued=false;state='aim';$('modal').classList.add('hidden');$('blueName').textContent=mode==='cpu'?'CPU':'BLUE';updateUI();beep(420);}
function updateUI(){ $('redScore').textContent=scores[0];$('blueScore').textContent=scores[1];$('roundLabel').textContent=`ROUND ${round}`;$('turnLabel').textContent=`SHOT ${Math.min(shot+1,8)} / 8`;$('redCard').classList.toggle('active',turn===0);$('blueCard').classList.toggle('active',turn===1);$('hint').innerHTML=state==='rolling'?'Pucks in motion…<small>Watch for bumps and knockouts!</small>':state==='roundover'?'Round complete<small>Tap to continue</small>':turn===1&&settings.mode==='cpu'?'CPU lining up its shot…<small>Can you beat the machine?</small>':'Slide forward with your finger<small>Use finesse to land in a scoring zone • avoid the Pit!</small>';let chips='';for(let i=0;i<4;i++)chips+=`<span class="chip ${i<Math.ceil(shot/2)?'r':''}"></span>`;chips+='<span style="width:7px"></span>';for(let i=0;i<4;i++)chips+=`<span class="chip ${i<Math.floor(shot/2)?'b':''}"></span>`;$('chips').innerHTML=chips;}
function showToast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),1500)}
function modal(html){$('panel').innerHTML=html;$('modal').classList.remove('hidden')}
function menu(){modalPrev=state;state='paused';modal(`<h1>RICOCHET 500</h1><p>Bank the puck. Beat the pit.<br>First to 500 wins!</p><div class="stats"><span>🔴 RED</span><span>🔵 BLUE</span></div><button class="btn primary" id="one">▶ Play vs Computer</button><button class="btn" id="two">👥 Two Players — Pass & Play</button><button class="btn" id="how">How to Play</button>${modalPrev!=='menu'&&modalPrev!=='won'?'<button class="btn" id="resume">Resume Game</button>':''}<div class="toggle"><label for="soundToggle">Sound effects</label><input type="checkbox" id="soundToggle" ${settings.sound?'checked':''}></div><p style="font-size:11px">Made for touchscreens. Works offline after loading.</p>`);$('one').onclick=()=>start('cpu');$('two').onclick=()=>start('local');$('how').onclick=rules;$('soundToggle').onchange=e=>{settings.sound=e.target.checked;syncSound()};if($('resume'))$('resume').onclick=()=>{state=modalPrev;$('modal').classList.add('hidden')}}
function rules(){let prev=state==='paused'?modalPrev:state;state='paused';modal(`<h1>HOW TO PLAY</h1><p style="text-align:left"><b>1.</b> Touch the starting puck at bottom-right.<br><b>2.</b> Slide your finger forward and release to shoot. Use a shorter, gentler stroke for finesse.<br><b>3.</b> Bounce off the angled cushions to enter the left scoring lane.<br><b>4.</b> Score <b>10, 20, 50 or 100</b>. The open Pit at the far end is worth zero; side rails keep pucks on the board!<br><b>5.</b> Each round has exactly four RED and four BLUE pucks, alternating turns. Pucks knock each other and fall off open edges.<br><b>6.</b> Only the pucks left on the board score after the eighth shot. First to <b>500</b> wins.</p><p>Tip: Shoot mostly straight UP along the right side. Smaller adjustments change where the puck comes down.</p><button class="btn primary" id="back">${prev==='menu'?'Start Playing':'Back to Game'}</button>`);$('back').onclick=()=>{if(prev==='menu')start('cpu');else {state=prev;$('modal').classList.add('hidden')}}}
function norm(x,y){let m=Math.hypot(x,y)||1;return [x/m,y/m]}function shoot(vx,vy,owner=turn){if(state!=='aim')return;let speed=Math.hypot(vx,vy);if(speed<300)return;vx=Math.max(-165,Math.min(165,vx));let puck={x:310,y:663,vx,vy,r:R,owner,moving:true,dead:false};pucks.push(puck);state='rolling';drag=null;settle=0;shotAge=0;updateUI();beep(410,.075,.10);}
function point(e){let b=C.getBoundingClientRect();return {x:(e.clientX-b.left-offsX)/scale,y:(e.clientY-b.top-offsY)/scale}}
C.addEventListener('pointerdown',e=>{if(state!=='aim'||turn===1&&settings.mode==='cpu')return;let p=point(e);if(p.x>218&&p.x<402&&p.y>565&&p.y<744){drag={startX:p.x,startY:p.y,x:p.x,y:p.y};C.setPointerCapture(e.pointerId);beep(190,.02,.025)}});C.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);drag.x=p.x;drag.y=p.y});function pointerRelease(e){if(!drag)return;let p=point(e);let dx=p.x-drag.startX,dy=p.y-drag.startY;drag=null;if(dy>-15)return; // drag towards top
// horizontal influence limited to make repeatable skill shots
let vy=-Math.min(1040,Math.max(360,-dy*5.2));let vx=Math.max(-165,Math.min(165,dx*2.65));shoot(vx,vy)}C.addEventListener('pointerup',pointerRelease);C.addEventListener('pointercancel',()=>drag=null);
function segHit(p,s,rest=.90){let ux=s.bx-s.ax,uy=s.by-s.ay,len2=ux*ux+uy*uy,t=Math.max(0,Math.min(1,((p.x-s.ax)*ux+(p.y-s.ay)*uy)/len2));let cx=s.ax+t*ux,cy=s.ay+t*uy,dx=p.x-cx,dy=p.y-cy,dist=Math.hypot(dx,dy);let thick=s.thick||5,rr=p.r+thick;if(dist>=rr)return false;let nx,ny;if(dist>0.0001){nx=dx/dist;ny=dy/dist}else{[nx,ny]=norm(-uy,ux)}p.x+=nx*(rr-dist+.05);p.y+=ny*(rr-dist+.05);let dot=p.vx*nx+p.vy*ny;if(dot<0){p.vx-=(1+rest)*dot*nx;p.vy-=(1+rest)*dot*ny;let tx=-ny,ty=nx,tan=p.vx*tx+p.vy*ty;p.vx-=tan*tx*.018;p.vy-=tan*ty*.018;if(Math.abs(dot)>110)beep(190+Math.min(400,Math.abs(dot)*.55),.033,.05)}return true}
function collision(a,b){if(a.dead||b.dead)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>=min)return;let nx=d?dx/d:1,ny=d?dy/d:0,o=(min-d+.01)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let j=-(1+.69)*rv/2;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;if(Math.abs(rv)>85)beep(250+Math.min(500,Math.abs(rv)),.045,.07)}}
function update(dt){if(state!=='rolling')return;shotAge+=dt;const boundaries=[{ax:boardL,ay:242,bx:boardL,by:boardB,thick:6},{ax:boardR,ay:242,bx:boardR,by:boardB,thick:6},{ax:divX,ay:divTop,bx:divX,by:divBot,thick:5},...bumpers.map(s=>({...s,thick:7}))];let moving=0;for(let p of pucks){if(p.dead)continue;let speed=Math.hypot(p.vx,p.vy);if(speed>.05){let dragForce=245;let next=Math.max(0,speed-dragForce*dt);p.vx*=next/speed;p.vy*=next/speed;p.x+=p.vx*dt;p.y+=p.vy*dt;}for(let s of boundaries)segHit(p,s,s.thick===7?.79:.24);if((p.x<divX&&p.y>boardB-p.r)||(p.y>boardB+p.r)||(p.y<topY-31)){p.dead=true;p.vx=p.vy=0;beep(95,.05,.11)}if(Math.hypot(p.vx,p.vy)<8){p.vx=0;p.vy=0}else moving++}for(let i=0;i<pucks.length;i++)for(let j=i+1;j<pucks.length;j++)collision(pucks[i],pucks[j]);if(moving===0)settle+=dt;else settle=0;if(settle>.35||shotAge>13){for(let p of pucks)if(Math.hypot(p.vx,p.vy)<15){p.vx=p.vy=0} if(shotAge>13)for(let p of pucks){p.vx=p.vy=0}endShot()}}
function points(p){if(p.dead||p.x>divX-R/2||p.x<boardL||p.y<430||p.y>boardB-10)return 0;if(p.y<520)return 10;if(p.y<582)return 20;if(p.y<642)return 50;if(p.y<695)return 100;return 0}
function endShot(){state='aim';shot++;turn=shot%2;let just=pucks[pucks.length-1],score=points(just);showToast(just.dead?'IN THE PIT — 0':score?`${score} ZONE!`:'SET UP THE NEXT SHOT!');if(shot>=8){state='roundover';setTimeout(roundEnd,1200)}else if(settings.mode==='cpu'&&turn===1){aiTimer=setTimeout(cpuShoot,800)}updateUI()}
function roundEnd(){if(state!=='roundover')return;let gain=[0,0];for(let p of pucks)gain[p.owner]+=points(p);scores[0]+=gain[0];scores[1]+=gain[1];best=Math.max(best,scores[0]);localStorage.setItem('ricochet500best',best);beep(600,.065,.17);if(scores[0]>=500||scores[1]>=500){let winner=scores[0]===scores[1]?'TIE GAME!':scores[0]>scores[1]?'RED WINS!':settings.mode==='cpu'?'CPU WINS!':'BLUE WINS!';state='won';modal(`<h1>${winner}</h1><p>Final score</p><div class="stats"><span>🔴 ${scores[0]}</span><span>🔵 ${scores[1]}</span></div><p>Great banking! Ready for another match?</p><button class="btn primary" id="again">Play Again</button><button class="btn" id="switch">Change Mode</button>`);$('again').onclick=()=>start();$('switch').onclick=menu;updateUI();return}modal(`<h1>ROUND ${round}</h1><p>All eight pucks are in. The score is counted!</p><div class="stats"><span>🔴 +${gain[0]}</span><span>🔵 +${gain[1]}</span></div><p>Total: <b>${scores[0]} – ${scores[1]}</b> · First to 500</p><button class="btn primary" id="next">Next Round →</button>`);$('next').onclick=()=>{round++;shot=0;turn=0;pucks=[];state='aim';$('modal').classList.add('hidden');updateUI()};updateUI()}
function cpuShoot(){if(state!=='aim'||turn!==1||settings.mode!=='cpu')return;let power=770+Math.random()*205;let vx=-38+(Math.random()-.5)*85; // aim near crown to deflect into scoring side
shoot(vx,-power,1)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){let w=C.clientWidth,h=C.clientHeight;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(offsX,offsY);ctx.scale(scale,scale);ctx.fillStyle='#0b1625';ctx.fillRect(0,0,W,H); // game board
let grad=ctx.createLinearGradient(0,55,0,735);grad.addColorStop(0,'#ffe78b');grad.addColorStop(.5,'#f5d36b');grad.addColorStop(1,'#eac257');ctx.fillStyle=grad;roundRect(17,38,386,703,18);ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#785d34';roundRect(17,38,386,703,18);ctx.stroke();ctx.strokeStyle='#fff1b866';ctx.lineWidth=1;for(let x=31;x<398;x+=13){ctx.beginPath();ctx.moveTo(x,48);ctx.lineTo(x,730);ctx.stroke()}ctx.fillStyle='#322f29';ctx.font='900 17px system-ui';ctx.textAlign='center';ctx.fillText('R I C O C H E T',209,63); // side walls
ctx.strokeStyle='#8e6937';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(boardL,245);ctx.lineTo(boardL,boardB);ctx.moveTo(boardR,245);ctx.lineTo(boardR,boardB);ctx.stroke();ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(boardL+3,248);ctx.lineTo(boardL+3,boardB);ctx.moveTo(boardR-3,248);ctx.lineTo(boardR-3,boardB);ctx.stroke(); // divider
ctx.strokeStyle='#806239';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(divX,divTop);ctx.lineTo(divX,divBot);ctx.stroke();ctx.strokeStyle='#f2d48a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(divX,divTop);ctx.lineTo(divX,divBot);ctx.stroke(); // scoring zones
const zones=[{y:520,t:'10'},{y:582,t:'20'},{y:642,t:'50'},{y:695,t:'100'}];ctx.lineCap='butt';ctx.strokeStyle='#58758a';ctx.fillStyle='#355d7a';ctx.textAlign='center';ctx.font='900 24px system-ui';for(let z of zones){ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(38,z.y);ctx.lineTo(198,z.y);ctx.stroke();ctx.fillText(z.t,114,z.y+30)}ctx.fillStyle='#805538';ctx.font='800 13px system-ui';ctx.fillText('PIT — 0',114,719);ctx.strokeStyle='#b87b54';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(229,544);ctx.lineTo(383,544);ctx.stroke();ctx.fillStyle='#83543d';ctx.font='800 13px system-ui';ctx.fillText('FOUL LINE',305,535); // lane labels
ctx.save();ctx.translate(344,338);ctx.rotate(-Math.PI/2);ctx.font='900 18px system-ui';ctx.fillStyle='#74603c';ctx.fillText('SHOOTING ALLEY',0,0);ctx.restore();ctx.save();ctx.translate(85,337);ctx.rotate(-Math.PI/2);ctx.font='900 17px system-ui';ctx.fillStyle='#74603c';ctx.fillText('SCORING ALLEY',0,0);ctx.restore(); // bumper backing + elastics
for(let s of bumpers){ctx.strokeStyle='#83602b';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.lineTo(s.bx,s.by);ctx.stroke();ctx.strokeStyle='#f3f7ef';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(s.ax,s.ay);ctx.lineTo(s.bx,s.by);ctx.stroke();ctx.strokeStyle='#a4bac6';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.ax,s.ay-3);ctx.lineTo(s.bx,s.by-3);ctx.stroke()}for(let pt of [[28,235],[209,75],[392,235]]){ctx.fillStyle='#725324';ctx.beginPath();ctx.arc(...pt,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5d991';ctx.beginPath();ctx.arc(...pt,5,0,Math.PI*2);ctx.fill()}
// aim guide
if(state==='aim'&&!(settings.mode==='cpu'&&turn===1)){ctx.setLineDash([8,9]);ctx.lineWidth=2;ctx.strokeStyle=turn===0?'#ff6559bb':'#3ca6ffbb';ctx.beginPath();ctx.arc(310,663,20,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);if(drag){let dx=drag.x-drag.startX,dy=drag.y-drag.startY,vx=Math.max(-165,Math.min(165,dx*2.65)),vy=-Math.min(1040,Math.max(360,-dy*5.2));let mul=150/Math.max(Math.hypot(vx,vy),1);ctx.setLineDash([6,6]);ctx.strokeStyle='#fffbea';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(310,663);ctx.lineTo(310+vx*mul,663+vy*mul);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffffffaa';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText(`POWER ${Math.round(Math.min(100,Math.max(0,-dy/200*100)))}%`,308,709)}else{ctx.strokeStyle='#ffffff75';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(310,639);ctx.lineTo(310,605);ctx.lineTo(304,615);ctx.moveTo(310,605);ctx.lineTo(316,615);ctx.stroke()}}
